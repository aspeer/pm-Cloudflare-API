name: Perl CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.42.0
        with:
          perl-version: '5.44.0'

      - name: Install dependencies
        run: cpanm --notest --installdeps .

      - name: Configure
        run: perl Makefile.PL

      - name: Run tests
        run: make test

      - name: Run distribution tests
        run: make disttest
